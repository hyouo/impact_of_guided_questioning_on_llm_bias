[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-theory-lab"
version = "0.3.0"
description = "A Chinese LLM theory course with evidence-bounded, reproducible mechanism experiments."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Yu Hong" },
]
keywords = [
  "large-language-models",
  "mechanistic-interpretability",
  "transformer-circuits",
  "causal-inference",
  "representation-learning",
  "education",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.16,<0.17",
  "twine>=6,<7",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.7,<10",
]
models = [
  "safetensors>=0.4",
  "torch>=2.2",
  "transformers>=4.45,<6",
]
all = [
  "build>=1.2,<2",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.7,<10",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.16,<0.17",
  "safetensors>=0.4",
  "torch>=2.2",
  "transformers>=4.45,<6",
  "twine>=6,<7",
]

[project.scripts]
llm-theory-lab = "llm_theory_lab.cli:main"

[project.urls]
Homepage = "https://github.com/hyouo/impact_of_guided_questioning_on_llm_bias"
Documentation = "https://hyouo.github.io/impact_of_guided_questioning_on_llm_bias/"
Issues = "https://github.com/hyouo/impact_of_guided_questioning_on_llm_bias/issues"
Source = "https://github.com/hyouo/impact_of_guided_questioning_on_llm_bias"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_theory_lab = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["llm_theory_lab"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
  "build",
  "dist",
  "reports",
  "site",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.ruff.format]
docstring-code-format = true
