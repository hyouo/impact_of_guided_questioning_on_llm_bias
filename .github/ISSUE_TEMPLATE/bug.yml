name: Bug report
description: 报告安装、CLI、实验或报告生成中的可复现缺陷
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请提供最小复现。安全漏洞不要在此公开，改用 Security 页面。
  - type: input
    id: version
    attributes:
      label: 版本或 commit
      placeholder: "0.2.0 / commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: "OS, Python version, device"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: 执行命令与最小输入
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为与完整错误
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 检查
      options:
        - label: 我已搜索现有 Issue
          required: true
        - label: 此报告不包含凭据、秘密或公开可利用的安全细节
          required: true
