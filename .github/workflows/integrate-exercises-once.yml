name: Integrate exercises once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/integrate-exercises-once.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Add exercises to navigation and learning path
        run: |
          python - <<'PY'
          from pathlib import Path

          mkdocs = Path("mkdocs.yml")
          text = mkdocs.read_text(encoding="utf-8")
          anchor = "  - 参考:\n"
          block = (
              "  - 练习册:\n"
              "      - 题目: exercises/index.md\n"
              "      - 答案与解析: exercises/solutions.md\n"
          )
          if block not in text:
              if anchor not in text:
                  raise SystemExit("mkdocs reference navigation anchor not found")
              text = text.replace(anchor, block + anchor, 1)
              mkdocs.write_text(text, encoding="utf-8")

          learning = Path("docs/learning_path.md")
          text = learning.read_text(encoding="utf-8")
          addition = """

## 路线 D：练习与研究写作

完成每章后，进入[练习册](exercises/index.md)做对应题组，再对照[答案与解析](exercises/solutions.md)。最后完成综合项目：选择一条 claim，写出定义、透明反例、开放模型观察、内部干预、负对照和结论边界。
"""
          if "## 路线 D：练习与研究写作" not in text:
              text = text.rstrip() + addition + "\n"
              learning.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          marker = "## 仓库结构\n"
          addition = (
              "## 练习与自测\n\n"
              "完成核心章节后，使用 [练习册](docs/exercises/index.md) 检查自己能否手算公式、区分证据等级、设计正负对照，并阅读 [答案与解析](docs/exercises/solutions.md)。\n\n"
          )
          if "## 练习与自测" not in text:
              if marker not in text:
                  raise SystemExit("README repository structure anchor not found")
              text = text.replace(marker, addition + marker, 1)
              readme.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/integrate-exercises-once.yml

      - name: Validate the exact result
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]"
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
          python scripts/validate_repository.py
          python -m pytest
          python -m mkdocs build --strict
          llm-theory run --lab all --output /tmp/llm-theory-lab --fail-on-check

      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add exercises and publishable learning site"
          git push
