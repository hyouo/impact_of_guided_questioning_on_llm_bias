name: normalize-markdown-math-once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/normalize-math-once.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Normalize math delimiters
        run: python scripts/normalize_markdown_math.py
      - name: Commit normalized Markdown
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md'
          if ! git diff --cached --quiet; then
            git commit -m "Fix GitHub Markdown math rendering"
            git push
          fi
