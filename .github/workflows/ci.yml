name: ci

on:
  push:
  pull_request:

jobs:
  theory-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/normalize_markdown_math.py --check
      - run: python scripts/validate_catalog.py
      - run: python scripts/validate_source_digest.py

  code-lab:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e "./code[dev]"
      - run: pytest code/tests
      - run: llm-theory-lab run-toy --output-dir /tmp/llm-theory-lab
