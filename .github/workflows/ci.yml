name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Validate theory and repository
        run: |
          python scripts/normalize_markdown_math.py --check
          python scripts/validate_catalog.py
          python scripts/validate_source_digest.py
          python scripts/check_repository.py
          python scripts/check_markdown_links.py
      - name: Build documentation
        run: mkdocs build --strict
      - name: Build distribution
        run: |
          python -m build
          python -m twine check dist/*

  tests:
    name: tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: |
          pytest --cov=llm_theory_lab --cov-report=term-missing --cov-report=xml
      - name: Run transparent experiment suite
        run: llm-theory-lab run-toy --output-dir reports/ci-toy
      - name: Upload coverage and experiment reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: ci-reports
          path: |
            coverage.xml
            reports/ci-toy/
          if-no-files-found: error
          retention-days: 14
