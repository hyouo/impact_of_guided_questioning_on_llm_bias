site_name: LLM Theory Lab
site_description: 从权重、激活与 Attention 到推理、因果可解释性、安全路由和公开结果复现的中文课程与实验
site_url: https://hyouo.github.io/impact_of_guided_questioning_on_llm_bias/
repo_url: https://github.com/hyouo/impact_of_guided_questioning_on_llm_bias
repo_name: hyouo/impact_of_guided_questioning_on_llm_bias
edit_uri: edit/main/docs/

strict: true

plugins:
  - search:
      lang:
        - zh
        - en

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首页: index.md
  - 课程:
      - 课程导览: course/index.md
      - 1. 模型是条件系统: course/01-model-as-conditional-system.md
      - 2. 权重、激活与 logits: course/02-weights-activations-and-logits.md
      - 3. Attention 与回路: course/03-attention-and-circuits.md
      - 4. 特征与 superposition: course/04-features-and-superposition.md
      - 5. 推理与生成反馈: course/05-reasoning-and-feedback.md
      - 6. 因果可解释性: course/06-causal-interpretability.md
      - 7. 安全路由: course/07-safety-routing.md
      - 8. 综合项目: course/08-capstone.md
  - 实验手册:
      - 实验导览: labs/index.md
      - C01. 权重与激活: labs/02-weight-vs-activation.md
      - C02. Softmax 与赔率: labs/01-softmax-and-odds.md
      - C03. 输入条件计算: labs/06-input-conditioning.md
      - C04. Attention 路由: labs/03-attention-routing.md
      - C05. 自回归反馈: labs/05-autoregressive-feedback.md
      - C06. Superposition: labs/07-superposition.md
      - C07. Probe 与因果: labs/04-probe-vs-causality.md
      - C08. Activation patching: labs/08-activation-patching.md
      - C09. 安全路由代理: labs/09-safety-routing.md
      - C10. 基底不变性: labs/10-basis-invariance.md
      - C11. 冗余路径: labs/11-redundant-paths.md
      - C12. Steering 对照: labs/12-steering-controls.md
      - 实验协议: experiments/EXPERIMENT_PROTOCOL.md
      - 结果结构: experiments/RESULT_SCHEMA.md
      - 证据台账与复现: experiments/EVIDENCE_LEDGER.md
  - 练习与评估:
      - 基础练习册: exercises/index.md
      - 基础答案与解析: exercises/solutions.md
      - 进阶方法练习: exercises/advanced.md
      - 进阶答案与解析: exercises/advanced-solutions.md
  - 深度参考:
      - 统一理论: reference/unified-theory.md
      - 经典机制案例: reference/case-studies.md
      - 方法与解释矩阵: reference/methods-matrix.md
      - 公开结果复现地图: reference/reproduction-map.md
      - Transformer Circuits 索引: reference/transformer-circuits-index.md
      - 术语表: reference/glossary.md
      - 开放问题与路线: reference/open-problems.md
      - 全部来源逐条精华: reference/source-digest.md
  - 项目:
      - 架构: ARCHITECTURE.md
      - 开发指南: DEVELOPMENT.md
      - Threat model: THREAT_MODEL.md
      - 维护者指南: MAINTAINER_GUIDE.md
      - 发布流程: RELEASING.md
